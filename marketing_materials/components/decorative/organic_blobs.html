<!--
  Component: Organic Blobs
  Source: one_pager_asymmetric
  Feedback: "The Pressure Points" title effect
  When to use: Background decoration for sections. Organic blob shapes using
  extreme border-radius, positioned absolutely at low opacity (0.08-0.1).
  Creates depth without distraction.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <title>Organic Blobs</title>
  <style>
    :root {
      --brand-green: #0A4D1C;
      --brand-dark: #073914;
      --coral: #BF5A3A;
      --teal: #0C7C6B;
      --amber: #C8952E;
      --navy: #1A2B4D;
      --coral-light: #FAEAE6;
      --teal-light: #E6F3F1;
      --amber-light: #FAF3E6;
      --navy-light: #E8EBF0;
    }

    body {
      font-family: 'Public Sans', sans-serif;
      margin: 0;
      padding: 0;
    }

    /* --- Organic Blobs Component --- */
    .blob-section {
      position: relative;
      overflow: hidden;
      padding: 64px 40px;
      background: #FAFAFA;
      min-height: 300px;
    }

    .blob {
      position: absolute;
      pointer-events: none;
    }

    .blob--green {
      width: 320px;
      height: 280px;
      background: var(--brand-green);
      opacity: 0.08;
      border-radius: 50% 40% 60% 30% / 40% 50% 35% 55%;
      top: -60px;
      right: -40px;
    }

    .blob--teal {
      width: 260px;
      height: 240px;
      background: var(--teal);
      opacity: 0.09;
      border-radius: 40% 60% 30% 50% / 55% 35% 50% 40%;
      bottom: -40px;
      left: -30px;
    }

    .blob--amber {
      width: 200px;
      height: 180px;
      background: var(--amber);
      opacity: 0.07;
      border-radius: 60% 30% 50% 40% / 35% 55% 40% 50%;
      top: 50%;
      left: 60%;
      transform: translate(-50%, -50%);
    }

    .blob--coral {
      width: 160px;
      height: 150px;
      background: var(--coral);
      opacity: 0.06;
      border-radius: 30% 50% 40% 60% / 50% 40% 55% 35%;
      top: 20px;
      left: 15%;
    }

    /* Demo content */
    .blob-content {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
    }

    .blob-content__title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--brand-dark);
      margin: 0 0 12px;
    }

    .blob-content__text {
      font-size: 0.92rem;
      color: var(--navy);
      line-height: 1.65;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="blob-section">
    <!-- Organic blob shapes -->
    <div class="blob blob--green"></div>
    <div class="blob blob--teal"></div>
    <div class="blob blob--amber"></div>
    <div class="blob blob--coral"></div>

    <!-- Content above blobs -->
    <div class="blob-content">
      <h2 class="blob-content__title">The Pressure Points</h2>
      <p class="blob-content__text">Every organisation faces a unique set of compliance challenges. The blobs create visual depth behind content, suggesting organic complexity without overwhelming the reader. Use varying sizes, opacities, and border-radius values for natural variation.</p>
    </div>
  </div>

</body>
</html>
