<!--
  Component: Road Journey
  Source: road_journey_sumplexity (custom SVG asset)
  Feedback: Winding road with map-pin milestones — strong visual metaphor for journeys and processes.
  When to use: Customer journeys, service stages, or any 4-step process that benefits from a
  travel/road metaphor. Map pins alternate above and below a curving road with step numbers,
  icons, and labels. Works best at full width (2400×640 SVG viewBox). Swap pin colours, icons,
  and labels to suit the brand and content.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; font-family: 'Public Sans', 'Calibri', sans-serif; }
</style>
</head>
<body>
<svg width="2400" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Road gradient — uses brand-dark at low opacity -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#073914; stop-opacity:0.10"/>
      <stop offset="50%" style="stop-color:#0A4D1C; stop-opacity:0.14"/>
      <stop offset="100%" style="stop-color:#073914; stop-opacity:0.10"/>
    </linearGradient>
    <!-- Road edge stroke -->
    <linearGradient id="roadEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A4D1C; stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#0A4D1C; stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#0A4D1C; stop-opacity:0.3"/>
    </linearGradient>
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="textShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Road surface -->
  <path d="M -30,292.5
    C 130,292.5 270,265 400,265
    C 530,265 700,320 850,320
    C 1000,320 1200,265 1350,265
    C 1500,265 1700,320 1850,320
    C 2000,320 2280,292.5 2430,292.5
    L 2430,347.5
    C 2280,347.5 2000,375 1850,375
    C 1700,375 1500,320 1350,320
    C 1200,320 1000,375 850,375
    C 700,375 530,320 400,320
    C 270,320 130,347.5 -30,347.5 Z" fill="url(#roadGrad)"/>

  <!-- Road edges -->
  <path d="M -30,292.5 C 130,292.5 270,265 400,265 C 530,265 700,320 850,320
    C 1000,320 1200,265 1350,265 C 1500,265 1700,320 1850,320
    C 2000,320 2280,292.5 2430,292.5" stroke="url(#roadEdge)" stroke-width="2.5" fill="none"/>
  <path d="M -30,347.5 C 130,347.5 270,320 400,320 C 530,320 700,375 850,375
    C 1000,375 1200,320 1350,320 C 1500,320 1700,375 1850,375
    C 2000,375 2280,347.5 2430,347.5" stroke="url(#roadEdge)" stroke-width="2.5" fill="none"/>

  <!-- Centre line dashes -->
  <path d="M -30,320.0 C 130,320.0 270,292.5 400,292.5 C 530,292.5 700,347.5 850,347.5
    C 1000,347.5 1200,292.5 1350,292.5 C 1500,292.5 1700,347.5 1850,347.5
    C 2000,347.5 2280,320.0 2430,320.0"
    stroke="#0A4D1C" stroke-width="3" stroke-dasharray="18,14" stroke-opacity="0.30" fill="none"/>

  <!-- ===== PIN 1 (above road) — Navy ===== -->
  <g filter="url(#pinShadow)">
    <path d="M 400,265 C 375,235 330,215 330,170 C 330,131 361,100 400,100
      C 439,100 470,131 470,170 C 470,215 425,235 400,265 Z" fill="#1A2B4D"/>
    <circle cx="400" cy="165" r="28" fill="rgba(255,255,255,0.12)"/>
    <!-- Icon: envelope -->
    <g transform="translate(400,165)" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="-14" y="-10" width="28" height="20" rx="3"/>
      <polyline points="-14,-10 0,4 14,-10"/>
    </g>
  </g>
  <text x="400" text-anchor="middle" font-family="'Public Sans', Calibri, sans-serif"
        font-size="30" font-weight="700" fill="#111111" filter="url(#textShadow)">
    <tspan x="400" y="48">Step one</tspan>
    <tspan x="400" y="82">title</tspan>
  </text>
  <circle cx="400" cy="96" r="4" fill="#1A2B4D" opacity="0.5"/>

  <!-- ===== PIN 2 (below road) — Teal ===== -->
  <g filter="url(#pinShadow)">
    <path d="M 850,375 C 875,405 920,425 920,470 C 920,509 889,540 850,540
      C 811,540 780,509 780,470 C 780,425 825,405 850,375 Z" fill="#0C7C6B"/>
    <circle cx="850" cy="475" r="28" fill="rgba(255,255,255,0.12)"/>
    <!-- Icon: map -->
    <g transform="translate(850,475)" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polygon points="-14,-12 -2,-6 -2,14 -14,8"/>
      <polygon points="-2,-6 14,-14 14,8 -2,14"/>
      <line x1="-2" y1="-6" x2="-2" y2="14"/>
    </g>
  </g>
  <text x="850" text-anchor="middle" font-family="'Public Sans', Calibri, sans-serif"
        font-size="30" font-weight="700" fill="#111111" filter="url(#textShadow)">
    <tspan x="850" y="578">Step two</tspan>
    <tspan x="850" y="612">title</tspan>
  </text>
  <circle cx="850" cy="544" r="4" fill="#0C7C6B" opacity="0.5"/>

  <!-- ===== PIN 3 (above road) — Amber ===== -->
  <g filter="url(#pinShadow)">
    <path d="M 1350,265 C 1325,235 1280,215 1280,170 C 1280,131 1311,100 1350,100
      C 1389,100 1420,131 1420,170 C 1420,215 1375,235 1350,265 Z" fill="#C8952E"/>
    <circle cx="1350" cy="165" r="28" fill="rgba(255,255,255,0.12)"/>
    <!-- Icon: check-circle -->
    <g transform="translate(1350,165)" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="0" cy="0" r="14"/>
      <polyline points="-6,0 -2,5 8,-6"/>
    </g>
  </g>
  <text x="1350" text-anchor="middle" font-family="'Public Sans', Calibri, sans-serif"
        font-size="30" font-weight="700" fill="#111111" filter="url(#textShadow)">
    <tspan x="1350" y="48">Step three</tspan>
    <tspan x="1350" y="82">title</tspan>
  </text>
  <circle cx="1350" cy="96" r="4" fill="#C8952E" opacity="0.5"/>

  <!-- ===== PIN 4 (below road) — Brand Green ===== -->
  <g filter="url(#pinShadow)">
    <path d="M 1850,375 C 1875,405 1920,425 1920,470 C 1920,509 1889,540 1850,540
      C 1811,540 1780,509 1780,470 C 1780,425 1825,405 1850,375 Z" fill="#0A4D1C"/>
    <circle cx="1850" cy="475" r="28" fill="rgba(255,255,255,0.12)"/>
    <!-- Icon: sun -->
    <g transform="translate(1850,475)" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="0" cy="0" r="7"/>
      <line x1="0" y1="-14" x2="0" y2="-10"/>
      <line x1="0" y1="10" x2="0" y2="14"/>
      <line x1="-14" y1="0" x2="-10" y2="0"/>
      <line x1="10" y1="0" x2="14" y2="0"/>
      <line x1="-9.9" y1="-9.9" x2="-7.1" y2="-7.1"/>
      <line x1="7.1" y1="7.1" x2="9.9" y2="9.9"/>
      <line x1="9.9" y1="-9.9" x2="7.1" y2="-7.1"/>
      <line x1="-7.1" y1="7.1" x2="-9.9" y2="9.9"/>
    </g>
  </g>
  <text x="1850" text-anchor="middle" font-family="'Public Sans', Calibri, sans-serif"
        font-size="30" font-weight="700" fill="#111111" filter="url(#textShadow)">
    <tspan x="1850" y="578">Step four</tspan>
    <tspan x="1850" y="612">title</tspan>
  </text>
  <circle cx="1850" cy="544" r="4" fill="#0A4D1C" opacity="0.5"/>

  <!-- Connecting flow arrows between pins -->
  <path d="M 440,250 C 550,230 680,340 810,370" stroke="#E5E4E1" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.6"/>
  <path d="M 890,390 C 1020,350 1180,240 1310,260" stroke="#E5E4E1" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.6"/>
  <path d="M 1390,250 C 1520,230 1680,340 1810,370" stroke="#E5E4E1" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Step number badges -->
  <circle cx="340" cy="182" r="14" fill="#E8EBF0"/>
  <text x="340" y="188" text-anchor="middle" font-family="'Public Sans', Calibri, sans-serif" font-size="15" font-weight="800" fill="#1A2B4D">1</text>

  <circle cx="770" cy="482" r="14" fill="#E6F3F1"/>
  <text x="770" y="488" text-anchor="middle" font-family="'Public Sans', Calibri, sans-serif" font-size="15" font-weight="800" fill="#0C7C6B">2</text>

  <circle cx="1290" cy="182" r="14" fill="#FAF3E6"/>
  <text x="1290" y="188" text-anchor="middle" font-family="'Public Sans', Calibri, sans-serif" font-size="15" font-weight="800" fill="#C8952E">3</text>

  <circle cx="1770" cy="482" r="14" fill="#E9F2EB"/>
  <text x="1770" y="488" text-anchor="middle" font-family="'Public Sans', Calibri, sans-serif" font-size="15" font-weight="800" fill="#0A4D1C">4</text>

</svg>
</body>
</html>
