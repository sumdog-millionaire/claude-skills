<!--
  Component: Glassmorphism Stat Cards
  Source: v8_split_contrast + v10_glass
  Feedback: "Subtle background pattern, good colour use, looks stylish" (v8)
            "Best of the dark mode, nice icons, very good whitespace" (v10)
  When to use: On dark backgrounds for a premium, modern feel. The frosted-glass
               effect and glowing numbers create visual depth. Works best with
               3-4 cards over a dark or gradient background.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-dark: #073914;
      --brand-green: #0A4D1C;
      --teal: #0C7C6B;
      --coral: #BF5A3A;
      --amber: #C8952E;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Public Sans', sans-serif;
      background: linear-gradient(135deg, var(--brand-dark) 0%, #0a1a0d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .glass-row {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .glass-card {
      width: 160px;
      padding: 28px 20px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      text-align: center;
      color: #fff;
    }
    .glass-card .stat-number {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
    }
    .glass-card:nth-child(1) .stat-number {
      color: #4ade80;
      text-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
    }
    .glass-card:nth-child(2) .stat-number {
      color: #5eead4;
      text-shadow: 0 0 20px rgba(94, 234, 212, 0.4);
    }
    .glass-card:nth-child(3) .stat-number {
      color: #fb923c;
      text-shadow: 0 0 20px rgba(251, 146, 60, 0.4);
    }
    .glass-card:nth-child(4) .stat-number {
      color: #f87171;
      text-shadow: 0 0 20px rgba(248, 113, 113, 0.4);
    }
    .glass-card .stat-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 6px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="glass-row">
    <div class="glass-card">
      <div class="stat-number">98%</div>
      <div class="stat-label">Compliance</div>
    </div>
    <div class="glass-card">
      <div class="stat-number">1.2k</div>
      <div class="stat-label">Assessments</div>
    </div>
    <div class="glass-card">
      <div class="stat-number">45</div>
      <div class="stat-label">Days Saved</div>
    </div>
    <div class="glass-card">
      <div class="stat-number">7</div>
      <div class="stat-label">Critical Fixes</div>
    </div>
  </div>
</body>
</html>
