<!--
  Component: Radial Washes Background
  Source: v8_venn (user liked: "nice whitespace, colouring is very nice, subtle backgrounds nice too")
  Feedback: "Nice whitespace, colouring is very nice, subtle backgrounds nice too."
  When to use: Full-page or large section backgrounds to add warmth and dimension.
  Overlapping colour washes at low opacity create organic depth. Works best behind
  white/light content cards.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <title>Radial Washes Background</title>
  <style>
    :root {
      --brand-green: #0A4D1C;
      --brand-dark: #073914;
      --coral: #BF5A3A;
      --teal: #0C7C6B;
      --amber: #C8952E;
      --teal-light: #E6F3F1;
    }

    body {
      font-family: 'Public Sans', sans-serif;
      margin: 0;
      padding: 32px;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
    }

    .wash-panel {
      position: relative;
      width: 100%;
      max-width: 640px;
      min-height: 400px;
      border-radius: 12px;
      background: #fafafa;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Radial wash 1: top-left green */
    .wash-panel::before {
      content: '';
      position: absolute;
      top: -20%;
      left: -10%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(10,77,28,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Radial wash 2: bottom-right teal */
    .wash-panel::after {
      content: '';
      position: absolute;
      bottom: -15%;
      right: -5%;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(12,124,107,0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Third wash via nested element */
    .wash-extra {
      position: absolute;
      top: 30%;
      right: 20%;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,149,46,0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    .wash-content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px;
    }

    .wash-card {
      background: rgba(255,255,255,0.85);
      border-radius: 10px;
      padding: 32px 40px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.04);
    }

    .wash-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--brand-dark);
      margin-bottom: 8px;
    }

    .wash-desc {
      font-size: 12px;
      color: #666;
      line-height: 1.6;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <div class="wash-panel">
    <div class="wash-extra"></div>
    <div class="wash-content">
      <div class="wash-card">
        <div class="wash-title">Radial Colour Washes</div>
        <div class="wash-desc">
          Three overlapping radial gradients at 0.04-0.06 opacity. Green top-left,
          teal bottom-right, amber centre-right. Creates organic warmth behind content.
        </div>
      </div>
    </div>
  </div>
</body>
</html>
